name: Deploy nodejs application

on:
    push:
      branches:
        - master

jobs: 
    build: 
      runs-on: ubuntu-latest
      steps: 
        - name: Checkout Source
          uses: actions/checkout@v4
        - name: Login to docker hub 
          run: docker login -u ${{secrets.DOCKER_USERNAME}} -p ${{secrets.DOCKER_PASSWORD}}
        - name: Build docker image
          run: docker build -t tosifkankod/backend . 
        - name: Publish Image to docker hub 
          run: docker push tosifkankod/backend:latest
    
    deploy: 
     needs: build
     runs-on: self-hosted
     steps: 
        - name: Pull image from docker hub 
          run: docker pull tosifkankod/backend:latest
        - name: Delete old container 
          run: docker rm -f backend_container
        - name: Run Docker container 
          run: docker run -d -p 5000:5000 --name backend_container -e MONGO_URI='${{secrets.MONGO_URI}}' tosifkankod/backend
